# Publishes to npm when a GitHub release is published (e.g. tag v1.0.1).
# Uses npm "Trusted Publishing" (OIDC): no NPM_TOKEN secret needed once the
# package is linked to this repository on npmjs.com (see docs/PUBLIER.md).
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
